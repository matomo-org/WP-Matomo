# Custom Apache configuration for the wp-matomo DDEV project.
#
# Derived from DDEV's stock apache-site.conf. It's customised because this project serves
# THREE WordPress installs from one web container, one per virtual host:
#
#   localhost                 -> /var/www/html/wp/tests       PHPUnit only
#   wp-matomo.ddev.site       -> /var/www/html/wp/single
#   wp-matomo-ms.ddev.site    -> /var/www/html/wp/multisite
#
# Note: the first block is also Apache's fallback for an unmatched Host
# header, and the integration tests reach the server as "localhost".
#
# See https://docs.ddev.com/en/stable/users/extend/customization-extendibility/#custom-apache-configuration

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/wp/tests

    <Directory "/var/www/html/wp/tests/">
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    LimitRequestFieldSize 16380

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

<VirtualHost *:80>
    ServerName wp-matomo.ddev.site
    ServerAlias wp-matomo.*
    DocumentRoot /var/www/html/wp/single

    <Directory "/var/www/html/wp/single/">
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    LimitRequestFieldSize 16380

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

<VirtualHost *:80>
    ServerName wp-matomo-ms.ddev.site
    ServerAlias wp-matomo-ms.*
    DocumentRoot /var/www/html/wp/multisite

    <Directory "/var/www/html/wp/multisite/">
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    LimitRequestFieldSize 16380

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/wp/tests

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key

    <Directory "/var/www/html/wp/tests/">
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    LimitRequestFieldSize 16380

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

<VirtualHost *:443>
    ServerName wp-matomo.ddev.site
    ServerAlias wp-matomo.*
    DocumentRoot /var/www/html/wp/single

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key

    <Directory "/var/www/html/wp/single/">
