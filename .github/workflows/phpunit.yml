name: PHPUnit Tests

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none
  id-token: write # for docker gha cache

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (DDEV)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0
        with:
          autostart: false

      - name: Start the environment
        run: ddev start

      - name: Install composer dependencies
        run: ddev composer install

      # Only the test install is needed here. The two browsable installs
      # (wp/single, wp/multisite) exist for local development.
      - name: Install WordPress
        run: ddev wp-matomo:install --only=tests

      - name: Run PHPUnit
        run: ddev wp-matomo:test

      - name: Run PHPUnit (multisite)
        run: ddev wp-matomo:test --multisite

      - name: Show web server logs on failure
        if: always()
        run: ddev logs -s web || true
